<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Casio fx-991EX ClassWiz Scientific Calculator on studio surface">
  <rect width="800" height="600" fill="#F1EDE4"/>
  <rect y="440" width="800" height="160" fill="#E6E0D3"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#D5CEC0" stroke-width="2"/>
  <!-- Soft contact shadow -->
  <ellipse cx="408" cy="492" rx="164" ry="22" fill="#141413" opacity="0.12"/>
  <!-- Calculator body -->
  <rect x="268" y="76" width="264" height="410" rx="22" fill="#1E2022" stroke="#141413" stroke-width="3"/>
  <rect x="280" y="88" width="240" height="386" rx="16" fill="#282B2E"/>
  <!-- Solar panel & branding header -->
  <rect x="300" y="106" width="76" height="22" rx="3" fill="#141413"/>
  <rect x="412" y="104" width="90" height="26" rx="4" fill="#3B2E28" stroke="#57473F" stroke-width="1.5"/>
  <line x1="435" y1="104" x2="435" y2="130" stroke="#57473F" stroke-width="1"/>
  <line x1="458" y1="104" x2="458" y2="130" stroke="#57473F" stroke-width="1"/>
  <line x1="481" y1="104" x2="481" y2="130" stroke="#57473F" stroke-width="1"/>
  <!-- LCD Screen -->
  <rect x="298" y="142" width="204" height="86" rx="6" fill="#C7D3C0" stroke="#141413" stroke-width="2"/>
  <text x="312" y="170" fill="#1A2418" font-family="monospace" font-size="15" font-weight="700">∫(x² + 4x)dx</text>
  <text x="488" y="212" text-anchor="end" fill="#1A2418" font-family="monospace" font-size="24" font-weight="700">1,248.50</text>
  <!-- Function keys (4x3) -->
  <g fill="#3C4045" stroke="#141413" stroke-width="1.5">
    <rect x="300" y="246" width="42" height="22" rx="4"/>
    <rect x="352" y="246" width="42" height="22" rx="4"/>
    <rect x="406" y="246" width="42" height="22" rx="4"/>
    <rect x="458" y="246" width="42" height="22" rx="4"/>
    <rect x="300" y="278" width="42" height="22" rx="4"/>
    <rect x="352" y="278" width="42" height="22" rx="4"/>
    <rect x="406" y="278" width="42" height="22" rx="4"/>
    <rect x="458" y="278" width="42" height="22" rx="4"/>
  </g>
  <!-- Numeric & operator keypad -->
  <g fill="#ECEAE4" stroke="#141413" stroke-width="1.5">
    <rect x="300" y="316" width="42" height="28" rx="5"/>
    <rect x="352" y="316" width="42" height="28" rx="5"/>
    <rect x="406" y="316" width="42" height="28" rx="5"/>
    <rect x="300" y="354" width="42" height="28" rx="5"/>
    <rect x="352" y="354" width="42" height="28" rx="5"/>
    <rect x="406" y="354" width="42" height="28" rx="5"/>
    <rect x="300" y="392" width="42" height="28" rx="5"/>
    <rect x="352" y="392" width="42" height="28" rx="5"/>
    <rect x="406" y="392" width="42" height="28" rx="5"/>
    <rect x="300" y="430" width="94" height="28" rx="5"/>
    <rect x="406" y="430" width="42" height="28" rx="5"/>
  </g>
  <!-- Orange AC/DEL & Green Equals keys -->
  <rect x="458" y="316" width="42" height="28" rx="5" fill="#D95D24" stroke="#141413" stroke-width="1.5"/>
  <rect x="458" y="354" width="42" height="28" rx="5" fill="#3C4045" stroke="#141413" stroke-width="1.5"/>
  <rect x="458" y="392" width="42" height="66" rx="5" fill="#0F533E" stroke="#141413" stroke-width="1.5"/>
</svg>
