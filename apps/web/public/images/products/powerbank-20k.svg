<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="20,000mAh USB-C Fast Charging Power Bank with braided cable">
  <rect width="800" height="600" fill="#EFECE6"/>
  <rect y="445" width="800" height="155" fill="#E2DDD3"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#CFC8BA" stroke-width="2"/>
  <ellipse cx="390" cy="486" rx="185" ry="22" fill="#141413" opacity="0.13"/>
  <!-- Braided USB-C loop -->
  <path d="M510 380 C610 380, 620 230, 535 230" fill="none" stroke="#141413" stroke-width="12" stroke-linecap="round"/>
  <rect x="515" y="218" width="32" height="24" rx="4" fill="#D95D24" stroke="#141413" stroke-width="2"/>
  <!-- Power bank enclosure -->
  <rect x="256" y="96" width="256" height="378" rx="28" fill="#1C2421" stroke="#141413" stroke-width="3"/>
  <rect x="272" y="112" width="224" height="346" rx="20" fill="#25302C"/>
  <!-- Digital percentage readout window -->
  <rect x="336" y="148" width="96" height="52" rx="10" fill="#111614" stroke="#394943" stroke-width="1.5"/>
  <text x="384" y="183" text-anchor="middle" fill="#4ADE80" font-family="monospace" font-size="26" font-weight="700">100%</text>
  <!-- Capacity badge -->
  <text x="384" y="378" text-anchor="middle" fill="#FAF8F4" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">20,000 mAh</text>
  <text x="384" y="404" text-anchor="middle" fill="#A3B1AA" font-family="sans-serif" font-size="13" font-weight="600">65W USB-C PD · FAST CHARGE</text>
  <!-- Accent power button -->
  <rect x="512" y="176" width="6" height="40" rx="2" fill="#D95D24"/>
</svg>
