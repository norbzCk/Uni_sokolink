<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Financial Accounting study notebook, index tabs, and fine-liner pens">
  <rect width="800" height="600" fill="#F3EFE6"/>
  <rect y="445" width="800" height="155" fill="#E5DECFE6"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#D2C9B8" stroke-width="2"/>
  <ellipse cx="400" cy="488" rx="210" ry="22" fill="#141413" opacity="0.11"/>
  <!-- Hardcover A4 Ledger Notebook -->
  <rect x="236" y="88" width="284" height="384" rx="8" fill="#0F533E" stroke="#141413" stroke-width="2.5"/>
  <rect x="236" y="88" width="28" height="384" fill="#093829" stroke="#141413" stroke-width="2"/>
  <!-- Colored index tabs on right edge -->
  <rect x="520" y="128" width="18" height="38" rx="3" fill="#D95D24" stroke="#141413" stroke-width="1.5"/>
  <rect x="520" y="176" width="18" height="38" rx="3" fill="#EAB308" stroke="#141413" stroke-width="1.5"/>
  <rect x="520" y="224" width="18" height="38" rx="3" fill="#0F533E" stroke="#141413" stroke-width="1.5"/>
  <!-- Cover label card -->
  <rect x="292" y="144" width="196" height="118" rx="4" fill="#FAF8F4" stroke="#141413" stroke-width="2"/>
  <text x="312" y="176" fill="#0F533E" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">ACADEMIC EDITION</text>
  <text x="312" y="204" fill="#141413" font-family="sans-serif" font-size="19" font-weight="700">IFRS &amp; Financial</text>
  <text x="312" y="228" fill="#141413" font-family="sans-serif" font-size="19" font-weight="700">Accounting Grid</text>
  <text x="312" y="248" fill="#5C5A54" font-family="sans-serif" font-size="12">160 GSM · Dot &amp; Ledger</text>
  <!-- Fineliner pen beside notebook -->
  <rect x="564" y="148" width="18" height="310" rx="6" fill="#141413"/>
  <rect x="564" y="148" width="18" height="72" rx="4" fill="#D95D24" stroke="#141413" stroke-width="1.5"/>
  <line x1="586" y1="162" x2="586" y2="212" stroke="#141413" stroke-width="3" stroke-linecap="round"/>
</svg>
